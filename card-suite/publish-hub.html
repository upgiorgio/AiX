<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiX Card Suite · 发布中心</title>
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/card-suite/common.css?v=20260222-2" />
    <style>
      .platform-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }

      .platform-chip {
        border: 1px solid rgba(150, 206, 234, 0.3);
        border-radius: 10px;
        padding: 8px 10px;
        background: rgba(7, 18, 30, 0.64);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .platform-chip input {
        width: auto;
      }

      .output-list {
        display: grid;
        gap: 10px;
      }

      .output-card {
        border: 1px solid rgba(150, 206, 234, 0.3);
        border-radius: 12px;
        background: rgba(7, 18, 30, 0.72);
        padding: 10px;
        display: grid;
        gap: 8px;
      }

      .output-card h4 {
        margin: 0;
        font-size: 0.96rem;
      }

      .checklist {
        display: grid;
        gap: 6px;
        font-size: 0.88rem;
      }

      .checklist label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="branding">
          <span class="brand-badge">🚀</span>
          <div>
            <h1>多平台发布中心 Publish Hub</h1>
            <p>为每个平台生成发布文案与执行清单</p>
          </div>
        </div>
        <nav class="nav-links">
          <a href="/card-suite/index.html">套件首页</a>
          <a href="/card-suite/card-designer.html">返回设计器</a>
          <a href="/card-suite/strategy.html">查看策略面板</a>
        </nav>
      </header>

      <main class="main-grid grid-2">
        <section class="card stack">
          <h3>发布参数</h3>
          <div class="form-grid">
            <label>
              内容主题
              <input id="topic" placeholder="本次发布的内容主题，如：提高内容产能的卡片工作流" />
            </label>
            <label>
              行动引导
              <input id="cta" placeholder="你希望读者做什么？如：收藏 + 评论领取模板" />
            </label>
          </div>

          <div class="platform-grid" id="platformGrid">
            <label class="platform-chip"><input type="checkbox" value="x" checked />X（1200×675）</label>
            <label class="platform-chip"><input type="checkbox" value="xiaohongshu" checked />小红书（1080×1440）</label>
            <label class="platform-chip"><input type="checkbox" value="wechat" checked />公众号（封面900×383）</label>
            <label class="platform-chip"><input type="checkbox" value="zhihu" checked />知乎（长图1080宽）</label>
            <label class="platform-chip"><input type="checkbox" value="bilibili" checked />B站（封面16:9）</label>
          </div>

          <div class="ai-panel" style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
              <span class="ai-label-badge">AI</span>
              <span style="font-size:0.88rem;color:var(--muted);">AI 分析各平台内容适配度</span>
            </div>
            <div id="aiScores"></div>
            <div class="actions" style="margin-top:8px;margin-bottom:0;">
              <button class="btn btn-primary" id="aiAnalyzeBtn">🤖 AI 平台适配分析</button>
            </div>
            <div id="aiAnalyzeStatus" style="font-size:0.82rem;color:var(--accent);margin-top:4px;min-height:18px;"></div>
          </div>

          <div class="actions">
            <button class="btn btn-primary" id="generateBtn">生成各平台发布内容</button>
            <button class="btn" id="copyAllBtn">复制全部文案</button>
            <button class="btn" id="downloadPlanBtn">下载执行清单</button>
          </div>

          <div class="output-box">
            <pre id="batchMeta">等待生成发布内容...</pre>
          </div>
        </section>

        <section class="card stack">
          <h3>平台输出</h3>
          <div id="outputs" class="output-list"></div>

          <h3>统一执行清单（72小时）</h3>
          <div class="checklist">
            <label><input type="checkbox" /> 发布前 2-6 小时发预热</label>
            <label><input type="checkbox" /> 首波评论 1 小时内集中回复</label>
            <label><input type="checkbox" /> 24h 内二次分发回流</label>
            <label><input type="checkbox" /> 72h 复盘：阅读/互动/转化</label>
          </div>
        </section>
      </main>

      <footer class="footer">
        <nav class="footer-nav">
          <a href="/">主站工作台</a>
          <a href="/md-lab">排版工坊</a>
          <a href="/card-suite/">文案卡片套件</a>
        </nav>
        <p class="footer-copy">
          <svg class="footer-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-3 17.5v-3c-3 .6-3.7-1.4-3.7-1.4-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.6 1 1.6 1 .9 1.5 2.3 1.1 2.8.8.1-.7.4-1.1.7-1.4-2.4-.3-4.8-1.2-4.8-5.1 0-1.1.4-2 1-2.7 0-.3-.4-1.3.1-2.6 0 0 .8-.3 2.8 1a9.5 9.5 0 0 1 5 0c2-1.3 2.8-1 2.8-1 .5 1.3.1 2.3.1 2.6.6.7 1 1.6 1 2.7 0 3.9-2.4 4.8-4.8 5.1.4.4.7 1 .7 2.1v3A9 9 0 0 0 12 3Z"/></svg>
          <a href="https://github.com/upgiorgio/AiX" target="_blank" rel="noopener noreferrer">upgiorgio/AiX</a>
          <span class="footer-dot">·</span>
          <span>© 2026 X Articles Studio &nbsp;·&nbsp; Crafted by Giorgio</span>
        </p>
      </footer>
    </div>

    <script src="/card-suite/common.js?v=20260222-1" defer></script>
    <script src="/card-suite/ai-gateway.js?v=20260813-1" defer></script>
    <script src="/card-suite/publish-hub.js?v=20260222-2" defer></script>
  </body>
</html>
