<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiX Card Suite · 卡片设计器</title>
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/card-suite/common.css?v=20260222-5" />
    <style>
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
      }

      .mini-card {
        border: 1px solid rgba(150, 206, 234, 0.3);
        border-radius: 10px;
        padding: 10px;
        background: rgba(7, 18, 30, 0.68);
      }

      .mini-card p {
        margin: 0;
        font-size: 0.84rem;
        line-height: 1.5;
        color: #ddf0ff;
        white-space: pre-wrap;
      }

      .mini-card .meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.74rem;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="branding">
          <span class="brand-badge">🎨</span>
          <div>
            <h1>卡片设计引擎 Card Designer</h1>
            <p>选择模板与尺寸，拆分长文为多张卡片</p>
          </div>
        </div>
        <nav class="nav-links">
          <a href="/card-suite/index.html">套件首页</a>
          <a href="/card-suite/copy-studio.html">文案工场</a>
          <a href="/card-suite/publish-hub.html">下一步：发布中心</a>
        </nav>
      </header>

      <main class="main-grid grid-2">
        <section class="card stack">
          <h3>编辑控制</h3>
          <div class="form-grid">
            <label>
              模板
              <select id="template">
                <optgroup label="── 冷色系 ──">
                  <option value="template-a">Aurora 极光蓝</option>
                  <option value="template-b">Void 深空</option>
                  <option value="template-h">Abyss 深渊</option>
                  <option value="template-m">Aqua 海洋</option>
                  <option value="template-p">Midnight 子夜</option>
                  <option value="template-r">Storm 风暴</option>
                  <option value="template-s">Crystal 水晶</option>
                  <option value="template-u">Arctic 极地</option>
                  <option value="template-z">Cobalt 钴蓝</option>
                </optgroup>
                <optgroup label="── 暖色系 ──">
                  <option value="template-d">Ember 琥珀橙</option>
                  <option value="template-e">Blossom 樱花</option>
                  <option value="template-i">Dusk 暮色</option>
                  <option value="template-o">Coral 珊瑚红</option>
                  <option value="template-t">Volcano 熔岩</option>
                  <option value="template-ac">Vivid 橘霞</option>
                </optgroup>
                <optgroup label="── 自然系 ──">
                  <option value="template-c">Sage 苍翠</option>
                  <option value="template-f">Nebula 星云紫</option>
                  <option value="template-q">Matcha 抹茶</option>
                  <option value="template-v">Olive 橄榄</option>
                  <option value="template-ad">Mint 薄荷</option>
                </optgroup>
                <optgroup label="── 专业系 ──">
                  <option value="template-j">Cyber 赛博</option>
                  <option value="template-l">Noir 碳黑</option>
                  <option value="template-n">Gold 烫金</option>
                  <option value="template-y">Neon 霓虹</option>
                  <option value="template-ab">Ink 水墨</option>
                </optgroup>
                <optgroup label="── 浅色系 ──">
                  <option value="template-g">Paper 稿纸</option>
                  <option value="template-k">Latte 拿铁</option>
                  <option value="template-aa">Parchment 羊皮</option>
                </optgroup>
                <optgroup label="── 特色系 ──">
                  <option value="template-w">Sakura Night 暗樱</option>
                  <option value="template-x">Sand 沙漠</option>
                </optgroup>
              </select>
            </label>
            <label>
              平台尺寸
              <select id="sizePreset">
                <option value="xhs">小红书 1080×1440</option>
                <option value="x">X 1200×675</option>
                <option value="wechat">公众号封面 900×383</option>
                <option value="square">朋友圈 1080×1080</option>
              </select>
            </label>
            <label>
              作者
              <input id="author" placeholder="卡片上显示的作者名" />
            </label>
            <label>
              卡片标题
              <input id="cardTitle" placeholder="卡片大标题，如：为什么你的内容产出总是断档" />
            </label>
          </div>

          <label>
            卡片正文
            <span class="md-hint">支持 <code>**粗体**</code> <code>*斜体*</code> <code>- 列表</code> <code>&gt; 引用</code> · 可粘贴长文自动拆分</span>
            <textarea id="cardText" rows="10"></textarea>
          </label>

          <!-- ── 排版微调 ── -->
          <h3 class="section-sub-title">排版微调</h3>
          <div class="form-grid typo-grid">
            <label>
              <span class="typo-label-row">标题字号 <span id="titleSizeVal" class="val-badge">24</span><small> px</small></span>
              <input type="range" id="titleSize" min="20" max="96" value="24" step="2" />
            </label>
            <label>
              <span class="typo-label-row">正文字号 <span id="bodySizeVal" class="val-badge">15</span><small> px</small></span>
              <input type="range" id="bodySize" min="12" max="28" value="15" step="1" />
            </label>
            <label>
              <span class="typo-label-row">左右内边距 <span id="paddingHVal" class="val-badge">24</span><small> px</small></span>
              <input type="range" id="paddingH" min="10" max="64" value="24" step="2" />
            </label>
            <label>
              <span class="typo-label-row">上下内边距 <span id="paddingVVal" class="val-badge">24</span><small> px</small></span>
              <input type="range" id="paddingV" min="10" max="64" value="24" step="2" />
            </label>
            <label>
              <span class="typo-label-row">行间距 <span id="lineHeightVal" class="val-badge">1.6</span></span>
              <input type="range" id="lineHeight" min="1.1" max="2.4" value="1.6" step="0.1" />
            </label>
            <label>
              文字对齐
              <select id="textAlign">
                <option value="left">← 左对齐</option>
                <option value="center">居中对齐</option>
                <option value="right">右对齐 →</option>
              </select>
            </label>
          </div>
          <div class="actions typo-presets">
            <button class="btn" data-typo-preset="default">标准排版</button>
            <button class="btn" data-typo-preset="large">大字模式</button>
            <button class="btn btn-primary" data-typo-preset="hero">超大标题</button>
          </div>

          <!-- ── 自定义背景 ── -->
          <h3 class="section-sub-title">自定义背景</h3>
          <div class="bg-custom-row">
            <div class="bg-swatches" id="bgSwatches">
              <button class="bg-swatch" style="background:linear-gradient(135deg,#0ea5e9,#1e40af)" data-bg="linear-gradient(135deg,#0ea5e9,#1e40af)" title="天蓝"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#f97316,#7c3aed)" data-bg="linear-gradient(135deg,#f97316,#7c3aed)" title="橙紫"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#06b6d4,#10b981)" data-bg="linear-gradient(135deg,#06b6d4,#10b981)" title="青绿"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#ec4899,#7c3aed)" data-bg="linear-gradient(135deg,#ec4899,#7c3aed)" title="粉紫"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#f43f5e,#fb923c)" data-bg="linear-gradient(135deg,#f43f5e,#fb923c)" title="糖果红"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#1e1b4b,#312e81)" data-bg="linear-gradient(135deg,#1e1b4b,#312e81)" title="深紫夜"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#16a34a,#14532d)" data-bg="linear-gradient(135deg,#16a34a,#14532d)" title="深森绿"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#92400e,#d97706)" data-bg="linear-gradient(135deg,#92400e,#d97706)" title="焦糖"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#be185d,#d97706)" data-bg="linear-gradient(135deg,#be185d,#d97706)" title="玫瑰金"></button>
              <button class="bg-swatch" style="background:linear-gradient(135deg,#1f2937,#4b5563)" data-bg="linear-gradient(135deg,#1f2937,#4b5563)" title="石墨"></button>
              <button class="bg-swatch bg-swatch-reset" id="bgResetBtn" title="重置为模板">↺</button>
            </div>
            <label class="bg-color-label" title="纯色背景">
              <input type="color" id="bgColorPicker" value="#0d1526" />
              <span>纯色</span>
            </label>
          </div>

          <!-- ── AI 助手 ── -->
          <h3 class="section-sub-title">🤖 AI 助手</h3>
          <div class="ai-panel">
            <div class="url-import-row">
              <input id="aiCardUrl" type="url" placeholder="粘贴文章链接，AI提取观点→自动填充卡片" />
              <button class="btn" id="aiCardUrlBtn">🔗 链接生成</button>
            </div>
            <label>主题关键词
              <input id="aiTopic" placeholder="例：高效内容创作的 3 个核心方法" />
            </label>
            <div class="actions" style="margin:0;flex-wrap:wrap;">
              <button class="btn btn-primary" id="aiCardGenerateBtn">✨ AI 生成卡片文案</button>
            </div>
            <div id="aiCardStatus" style="font-size:0.82rem;color:var(--accent);min-height:18px;margin-top:4px;"></div>
          </div>

          <div class="actions">
            <button class="btn" id="importDraftBtn">导入文案工场草稿</button>
            <button class="btn btn-primary" id="splitBtn">自动拆分为多张卡片</button>
            <button class="btn" id="saveStateBtn">保存样式到本地</button>
            <button class="btn btn-warm" id="toPublishBtn">进入发布中心</button>
          </div>
        </section>

        <section class="card stack">
          <h3>实时预览</h3>
          <div class="preview-stage">
            <article id="cardCanvas" class="card-canvas template-a">
              <div class="card-body">
                <div class="card-deco"></div>
                <h4 id="previewTitle">卡片标题</h4>
                <div id="previewText" class="md-render">正文内容会在这里展示。</div>
              </div>
              <div class="card-meta">
                <span id="previewSize">1080 × 1440</span>
                <span id="previewAuthor">@Giorgio</span>
              </div>
            </article>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="exportPngBtn">⬇ 导出 PNG</button>
            <button class="btn btn-ok" id="copyImageBtn">📋 复制图片</button>
            <button class="btn" id="copyJsonBtn">复制数据</button>
            <button class="btn" id="downloadJsonBtn">下载数据</button>
          </div>

          <h3>拆分结果</h3>
          <p class="muted" id="splitMeta">拆分后的卡片将显示在这里</p>
          <div id="cardsGrid" class="cards-grid"></div>
        </section>
      </main>

      <footer class="footer">
        <nav class="footer-nav">
          <a href="/">主站工作台</a>
          <a href="/md-lab">排版工坊</a>
          <a href="/card-suite/">文案卡片套件</a>
        </nav>
        <p class="footer-copy">
          <svg class="footer-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-3 17.5v-3c-3 .6-3.7-1.4-3.7-1.4-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.6 1 1.6 1 .9 1.5 2.3 1.1 2.8.8.1-.7.4-1.1.7-1.4-2.4-.3-4.8-1.2-4.8-5.1 0-1.1.4-2 1-2.7 0-.3-.4-1.3.1-2.6 0 0 .8-.3 2.8 1a9.5 9.5 0 0 1 5 0c2-1.3 2.8-1 2.8-1 .5 1.3.1 2.3.1 2.6.6.7 1 1.6 1 2.7 0 3.9-2.4 4.8-4.8 5.1.4.4.7 1 .7 2.1v3A9 9 0 0 0 12 3Z"/></svg>
          <a href="https://github.com/upgiorgio/AiX" target="_blank" rel="noopener noreferrer">upgiorgio/AiX</a>
          <span class="footer-dot">·</span>
          <span>© 2026 X Articles Studio &nbsp;·&nbsp; Crafted by Giorgio</span>
        </p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
    <script src="/card-suite/common.js?v=20260222-1" defer></script>
    <script src="/card-suite/ai-gateway.js?v=20260813-1" defer></script>
    <script src="/card-suite/card-designer.js?v=20260222-6" defer></script>
  </body>
</html>
