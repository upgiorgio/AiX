  <text x="512" y="790" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Serif SC','Songti SC',serif" font-size="20" fill="#242424">初稿先筛选，插图要贴题，排版必须公众号兼容</text>
